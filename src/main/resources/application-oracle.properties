# ===== Oracle (target enterprise database) =====
# Override credentials/URL via environment variables in real environments.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XE}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USERNAME:system}
spring.datasource.password=${ORACLE_PASSWORD:fincore}

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=FinCoreHikariPool
