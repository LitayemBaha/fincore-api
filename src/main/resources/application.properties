spring.application.name=fincore-api

# Active profile: "dev" (H2, default) or "oracle"
spring.profiles.active=dev

# ===== JPA (common) =====
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Base64-encoded 256-bit secret. Override in production via env var FINCORE_JWT_SECRET.
fincore.jwt.secret=${FINCORE_JWT_SECRET:c2VjdXJlLWZpbmNvcmUtZGVtby1zZWNyZXQta2V5LWNoYW5nZS1tZS0xMjM0NTY3OA==}
fincore.jwt.expiration-ms=3600000

# ===== OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
